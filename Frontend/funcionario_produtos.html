<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produtos do Funcionário - MerKdito</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="assets/js/config.js"></script><script src="assets/js/auth.js"></script>
<style>
.employee-wrap{max-width:1100px;margin:0 auto}.employee-card{padding:22px;margin:18px 0}.employee-row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.employee-field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px}.employee-message{display:none;padding:12px;border-radius:9px;margin:14px 0;white-space:pre-line}.employee-message.show{display:block}.employee-message.error{background:#fff0f0;color:#8e2424}.employee-message.success{background:#effaf2;color:#176b3a}.employee-message.info{background:#eef7fc;color:#245878}.employee-table-wrap{overflow:auto}.employee-table{width:100%;border-collapse:collapse;min-width:750px}.employee-table th,.employee-table td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.employee-table input{max-width:130px}
</style></head>
<body data-require-employee="true"><div class="bg-blob blob-1"></div><div class="bg-blob blob-2"></div><div class="app-container">
<aside class="sidebar"><a href="funcionario_vendas.html" class="logo" style="text-decoration:none"><span class="logo-text" style="color:#5DA54A;font-size:2rem;font-weight:800">MerKdito</span></a>
<ul class="nav-menu"><li><a href="funcionario_vendas.html" class="nav-item"><i class="fa-solid fa-cash-register"></i><span>Registrar venda</span></a></li><li><a href="funcionario_produtos.html" class="nav-item active"><i class="fa-solid fa-box"></i><span>Produtos</span></a></li><li><a href="funcionario_estoque.html" class="nav-item"><i class="fa-solid fa-boxes-stacked"></i><span>Estoque</span></a></li><li><a href="funcionario_relatorios.html" class="nav-item"><i class="fa-solid fa-chart-column"></i><span>Relatórios</span></a></li><li><a href="funcionario_compras.html" class="nav-item"><i class="fa-solid fa-truck"></i><span>Compras e fornecedores</span></a></li></ul>
<div class="logout-container"><a href="index.html" class="nav-item" onclick="MerkditoAuth.logout();return false;"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sair</a></div></aside>
<main class="main-content"><div class="employee-wrap"><header class="top-header"><div><h1 class="page-title">Produtos por estabelecimento</h1><p class="page-subtitle">Olá, <span id="nomeFuncionario">funcionário</span>. Preço e estoque mínimo são configurados por loja.</p></div></header>
<div id="mensagem" class="employee-message" role="status" aria-live="polite"></div>
<section class="glass-panel employee-card"><div class="employee-row"><div class="employee-field"><label for="loja">Estabelecimento autorizado</label><select id="loja" class="form-control"><option value="">Carregando…</option></select></div><div class="employee-field" style="flex:0 0 180px"><button id="btnCarregar" class="btn btn-primary" type="button">Carregar produtos</button></div></div></section>
<section class="glass-panel employee-card"><div class="employee-table-wrap"><table class="employee-table"><thead><tr><th>Produto</th><th>Código</th><th>Saldo</th><th>Preço de venda</th><th>Estoque mínimo</th><th>Ação</th></tr></thead><tbody id="produtos"><tr><td colspan="6">Selecione um estabelecimento.</td></tr></tbody></table></div></section>
</div></main></div>
<script>
(function(){'use strict';const $=id=>document.getElementById(id);let produtos=[];
function msg(t,type='info'){const e=$('mensagem');e.textContent=t;e.className='employee-message show '+type}function clear(){const e=$('mensagem');e.textContent='';e.className='employee-message'}
async function parse(r){const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch{}if(!r.ok)throw new Error(d?.mensagem||d?.message||`A API respondeu HTTP ${r.status}.`);return d}
function cell(tr,v){const td=document.createElement('td');td.textContent=v==null?'—':String(v);tr.appendChild(td);return td}
async function loadStores(){const data=await parse(await MerkditoAuth.apiFetchEmployee('funcionario/produtos/estabelecimentos'));const sel=$('loja');sel.replaceChildren();const o=document.createElement('option');o.value='';o.textContent='Selecione um estabelecimento';sel.appendChild(o);for(const x of (Array.isArray(data)?data:[])){const op=document.createElement('option');op.value=String(x.id);op.textContent=x.nome||`Estabelecimento ${x.id}`;op.dataset.editable=String(Boolean(x.podeEditar));sel.appendChild(op)}if(sel.options.length===1)msg('Não há estabelecimentos com permissão para visualizar ou editar produtos.')}
function render(){const body=$('produtos');body.replaceChildren();const selected=$('loja').selectedOptions[0];const canEdit=Boolean(selected&&selected.dataset.editable==='true');if(!produtos.length){const tr=document.createElement('tr'),td=cell(tr,'Nenhum produto disponível neste estabelecimento.');td.colSpan=6;body.appendChild(tr);return}
for(const p of produtos){const tr=document.createElement('tr');cell(tr,p.nome);cell(tr,p.codigoBarras||'—');cell(tr,p.quantidadeEstoque);const price=cell(tr,'');const priceInput=document.createElement('input');priceInput.type='number';priceInput.min='0';priceInput.step='.01';priceInput.max='9999999999.99';priceInput.value=Number(p.preco||0).toFixed(2);priceInput.className='form-control';priceInput.disabled=!canEdit;priceInput.setAttribute('aria-label','Preço de '+p.nome);price.appendChild(priceInput);const min=cell(tr,'');const minInput=document.createElement('input');minInput.type='number';minInput.min='0';minInput.max='1000000';minInput.step='1';minInput.value=String(p.estoqueMinimo||0);minInput.className='form-control';minInput.disabled=!canEdit;minInput.setAttribute('aria-label','Estoque mínimo de '+p.nome);min.appendChild(minInput);const action=cell(tr,'');const btn=document.createElement('button');btn.className='btn btn-primary';btn.type='button';btn.textContent=canEdit?'Salvar':'Sem permissão para editar';btn.disabled=!canEdit;btn.addEventListener('click',async()=>{const preco=Number(priceInput.value),estoqueMinimo=Number(minInput.value),estabelecimentoId=Number($('loja').value);if(!Number.isFinite(preco)||preco<0||preco>9999999999.99||!Number.isInteger(estoqueMinimo)||estoqueMinimo<0||estoqueMinimo>1000000){msg('Informe preço e estoque mínimo válidos.','error');return}btn.disabled=true;try{const result=await parse(await MerkditoAuth.apiFetchEmployee(`funcionario/produtos/${p.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({estabelecimentoId,precoVenda:preco,estoqueMinimo})}));p.preco=result.precoVenda;p.estoqueMinimo=result.estoqueMinimo;msg(result.mensagem||'Produto atualizado.','success')}catch(e){if(!MerkditoAuth.isSessionRedirectError?.(e))msg(e.message||'Não foi possível salvar.','error')}finally{btn.disabled=false}});action.appendChild(btn);body.appendChild(tr)}}
async function load(){clear();const id=Number($('loja').value);if(!id){msg('Selecione um estabelecimento.','error');return}const btn=$('btnCarregar');btn.disabled=true;try{const data=await parse(await MerkditoAuth.apiFetchEmployee(`funcionario/produtos?estabelecimentoId=${id}`));produtos=Array.isArray(data)?data:[];render();if(!produtos.length)msg('Nenhum produto disponível.','info')}catch(e){if(!MerkditoAuth.isSessionRedirectError?.(e))msg(e.message||'Não foi possível carregar produtos.','error')}finally{btn.disabled=false}}
$('btnCarregar').addEventListener('click',load);$('loja').addEventListener('change',()=>{produtos=[];render();clear()});$('nomeFuncionario').textContent=MerkditoAuth.nome||'funcionário';if(MerkditoAuth.requireEmployee())loadStores().catch(e=>{if(!MerkditoAuth.isSessionRedirectError?.(e))msg(e.message||'Falha ao carregar estabelecimentos.','error')});
})();
</script></body></html>
